# signalbox configuration. ${VAR} is read from the environment; a receiver
# whose variable is unset is switched off with a warning at startup.
listen: ":8080"
grpc_listen: ":4317"
ingest_token: ${SIGNALBOX_INGEST_TOKEN}   # senders use "Authorization: Bearer <token>"
api_token: ${SIGNALBOX_API_TOKEN}         # protects /tail, /api/* and /metrics
state_file: ${SIGNALBOX_STATE_FILE}       # put it on a volume to keep alert state across restarts

clickhouse:                               # optional; leave CLICKHOUSE_URL unset to run without storage
  url: ${CLICKHOUSE_URL}
  user: ${CLICKHOUSE_USER}
  password: ${CLICKHOUSE_PASSWORD}
  retention_days: 30

receivers:
  - name: slack
    type: slack
    url: ${SLACK_WEBHOOK_URL}
  - name: discord
    type: discord
    url: ${DISCORD_WEBHOOK_URL}
  - name: pagerduty
    type: pagerduty
    routing_key: ${PAGERDUTY_ROUTING_KEY}
  - name: webhook
    type: webhook
    url: ${ALERT_WEBHOOK_URL}

rules:
  # Requests failing: more than 5% 5xx over 5 minutes, sustained for 2.
  - name: http-5xx
    when: error_ratio > 0.05
    min_requests: 50
    window: 5m
    for: 2m
    severity: critical
    summary: More than 5% of requests are failing with 5xx.
    notify: [slack, discord, pagerduty, webhook]

  # Requests slow: p99 above 2 s over 5 minutes, sustained for 5.
  - name: http-slow
    when: p99_ms > 2000
    min_requests: 50
    window: 5m
    for: 5m
    severity: warning
    summary: The slowest 1% of requests take more than 2 seconds.
    notify: [slack, discord, webhook]

  # Error logs: a burst of error-level lines.
  - name: error-logs
    match: {min_severity: error}
    when: count > 25
    window: 5m
    for: 1m
    severity: warning
    notify: [slack, discord, webhook]

  # Crash signatures: one is enough.
  - name: crash
    match:
      body: '(?i)(panic:|fatal error|out of memory|segmentation fault|unhandled (promise )?rejection|traceback \(most recent call last\))'
    when: count > 0
    window: 5m
    resolve_after: 10m
    severity: critical
    notify: [slack, discord, pagerduty, webhook]

  # A service that normally logs and has gone quiet. Off by default: enable it
  # for services that log continuously, or it will flag quiet ones.
  # - name: silent
  #   match: {service: [worker]}
  #   when: count < 1
  #   window: 15m
  #   notify: [slack]
